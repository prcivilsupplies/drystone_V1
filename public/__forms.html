<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>DryStone enquiry form registration</title></head>
<body>
<form name="project-enquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="project-enquiry">
  <input type="text" name="name">
  <input type="tel" name="phone">
  <input type="email" name="email">
  <input type="text" name="service">
  <textarea name="message"></textarea>
  <input name="bot-field">
  <input type="hidden" name="source-page">
  <input type="hidden" name="utm-source">
  <input type="hidden" name="utm-medium">
  <input type="hidden" name="utm-campaign">
</form>
</body>
</html>
