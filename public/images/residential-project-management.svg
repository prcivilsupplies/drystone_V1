<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Residential construction project management</title>
  <desc id="desc">Five stages of custom home project management: project setup, planning and procurement, site coordination, monitoring and quality control, and handover.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#e9e3d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f2e1a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e67e22"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <path d="M0 0h520L170 1000H0z" fill="#1a4d2e" opacity=".05"/>
  <path d="M1600 0h-340l180 1000h160z" fill="#e67e22" opacity=".06"/>

  <text x="800" y="70" text-anchor="middle" fill="#0f2e1a" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="5">CUSTOM HOME DELIVERY</text>
  <text x="800" y="128" text-anchor="middle" fill="#0f2e1a" font-family="Arial, sans-serif" font-size="52" font-weight="900">Construction Project Management</text>
  <text x="800" y="168" text-anchor="middle" fill="#5f655f" font-family="Arial, sans-serif" font-size="22">One accountable team from first brief to final handover</text>

  <path d="M390 300 C620 180 1000 180 1210 310 C1380 420 1370 650 1190 760 C950 905 570 885 350 735 C185 620 190 410 390 300z" fill="none" stroke="#e67e22" stroke-width="7" stroke-dasharray="16 16" marker-end="url(#arrow)" opacity=".8"/>

  <g transform="translate(570 340)">
    <circle cx="230" cy="230" r="205" fill="#0f2e1a"/>
    <circle cx="230" cy="230" r="178" fill="#1a4d2e" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
    <path d="M92 250L230 135l138 115v135H92z" fill="#f8f5ef"/>
    <path d="M72 255L230 115l158 140" fill="none" stroke="#e67e22" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="194" y="287" width="72" height="98" rx="3" fill="#e67e22"/>
    <rect x="118" y="278" width="52" height="48" rx="3" fill="#92b0a0"/>
    <rect x="290" y="278" width="52" height="48" rx="3" fill="#92b0a0"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(90 220)">
      <rect width="390" height="180" rx="24" fill="#ffffff"/>
      <circle cx="52" cy="50" r="29" fill="#e67e22"/>
      <text x="52" y="59" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">1</text>
      <text x="95" y="51" fill="#0f2e1a" font-size="25" font-weight="800">Project setup</text>
      <text x="34" y="94" fill="#5f655f" font-size="19">Scope, feasibility &amp; approvals</text>
      <text x="34" y="126" fill="#5f655f" font-size="19">Client priorities &amp; budget</text>
      <text x="34" y="158" fill="#5f655f" font-size="19">Design-team alignment</text>
    </g>

    <g transform="translate(1118 220)">
      <rect width="390" height="180" rx="24" fill="#ffffff"/>
      <circle cx="52" cy="50" r="29" fill="#e67e22"/>
      <text x="52" y="59" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">2</text>
      <text x="95" y="51" fill="#0f2e1a" font-size="25" font-weight="800">Plan &amp; procure</text>
      <text x="34" y="94" fill="#5f655f" font-size="19">Programme &amp; trade sequencing</text>
      <text x="34" y="126" fill="#5f655f" font-size="19">Material selection &amp; ordering</text>
      <text x="34" y="158" fill="#5f655f" font-size="19">Transparent cost planning</text>
    </g>

    <g transform="translate(1135 640)">
      <rect width="390" height="180" rx="24" fill="#ffffff"/>
      <circle cx="52" cy="50" r="29" fill="#e67e22"/>
      <text x="52" y="59" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">3</text>
      <text x="95" y="51" fill="#0f2e1a" font-size="25" font-weight="800">Coordinate site</text>
      <text x="34" y="94" fill="#5f655f" font-size="19">Trades, suppliers &amp; deliveries</text>
      <text x="34" y="126" fill="#5f655f" font-size="19">Safety &amp; construction activity</text>
      <text x="34" y="158" fill="#5f655f" font-size="19">Clear client communication</text>
    </g>

    <g transform="translate(605 790)">
      <rect width="390" height="170" rx="24" fill="#ffffff"/>
      <circle cx="52" cy="50" r="29" fill="#e67e22"/>
      <text x="52" y="59" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">4</text>
      <text x="95" y="51" fill="#0f2e1a" font-size="25" font-weight="800">Monitor &amp; control</text>
      <text x="34" y="94" fill="#5f655f" font-size="19">Quality, programme &amp; cost</text>
      <text x="34" y="126" fill="#5f655f" font-size="19">Inspections &amp; issue resolution</text>
    </g>

    <g transform="translate(75 640)">
      <rect width="390" height="180" rx="24" fill="#ffffff"/>
      <circle cx="52" cy="50" r="29" fill="#e67e22"/>
      <text x="52" y="59" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">5</text>
      <text x="95" y="51" fill="#0f2e1a" font-size="25" font-weight="800">Inspect &amp; hand over</text>
      <text x="34" y="94" fill="#5f655f" font-size="19">Final quality inspection</text>
      <text x="34" y="126" fill="#5f655f" font-size="19">Defects &amp; documentation</text>
      <text x="34" y="158" fill="#5f655f" font-size="19">A confident client handover</text>
    </g>
  </g>
</svg>
